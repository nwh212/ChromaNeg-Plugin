name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release --target wasm32-unknown-unknown
      - uses: actions/upload-artifact@v4
        with:
          name: chromaneg-wasm
          path: target/wasm32-unknown-unknown/release/chromaneg.wasm

  release:
    # a tag vX.Y.Z publishes chromaneg-vX.Y.Z.wasm as a GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check the tag matches Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }
      - run: cargo build --release --target wasm32-unknown-unknown
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/wasm32-unknown-unknown/release/chromaneg.wasm "chromaneg-$GITHUB_REF_NAME.wasm"
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0 ~ "^"v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "chromaneg-$GITHUB_REF_NAME.wasm" --title "ChromaNeg $GITHUB_REF_NAME" --notes "$notes"
