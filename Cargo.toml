[package]
name = "chromaneg"
description = "Film negative conversion for Chromaforge: a WebAssembly pixel-filter plug-in"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/nwh212/ChromaNeg-Plugin"
readme = "README.md"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
strip = true
