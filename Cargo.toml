[package]
name = "chromaneg"
description = "Pixel filter: film negative / slide conversion with a whole-image measurement (Analyze) step"
version = "0.8.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
strip = true
