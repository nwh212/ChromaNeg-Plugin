[package]
name = "chromalab"
description = "Film negative conversion for Chromaforge: a WebAssembly pixel-filter plug-in"
version = "0.12.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/nwh212/ChromaNeg-Plugin"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chromalab-core = { path = "../../crates/chromalab-core" }
pixel-filter = { path = "../../crates/pixel-filter" }
serde_json = "1"
