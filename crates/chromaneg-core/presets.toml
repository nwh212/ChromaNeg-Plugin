# ChromaNeg's presets: tone profiles and film stocks (with the creative looks at the end), in menu order (the first of each is
# the default). The build turns this file into constants (build.rs), so editing it is all a new or
# changed preset takes; the menus in the manifest follow. A field left out takes the neutral value:
#
# profile: slopes [1, 1, 1] (the curve's slope at the shadows, the midpoint and the highlights),
#          power 1 (t -> linear light), lift 0 (black floor), gamma 1 (midtones), sat 1
# stock:   crosstalk 1, sat 1, contrast 0, darks 0, temp 0, tint 0 (< 0 counters magenta),
#          shadows / highlights [0, 0, 0] (added to R, G, B in t after the tone curve),
#          hue_sat [1, 1, 1, 1, 1, 1] (saturation by hue: red, yellow, green, cyan, blue, magenta),
#          fade 0 (lifts black)


# ------------------------------------------------------------------------------------------------
# Tone profiles


# fitted to three reference conversions: linear light ≈ t^1.68, highlights rolled off at the top
[[profile]]
name = "Standard"
power = 1.68

[[profile]]
name = "Soft"
slopes = [1.15, 0.88, 1.15]
power = 1.57
sat = 0.97

[[profile]]
name = "Hard"
slopes = [0.8, 1.25, 0.8]
power = 1.79
sat = 1.04

[[profile]]
name = "Highlight Soft"
slopes = [1.0, 1.05, 0.6]
power = 1.68

[[profile]]
name = "Highlight Hard"
slopes = [1.0, 0.95, 1.3]
power = 1.68

[[profile]]
name = "Shadow Soft"
slopes = [1.3, 0.95, 1.0]
power = 1.62

[[profile]]
name = "Shadow Hard"
slopes = [0.7, 1.1, 1.0]
power = 1.74

# flat starting points for grading: not scaled with Standard
[[profile]]
name = "Cine Log"
slopes = [1.2, 0.8, 1.2]
lift = 0.05
sat = 0.85

[[profile]]
name = "Cine Rich"
slopes = [0.75, 1.3, 0.75]
power = 1.74
sat = 1.12

[[profile]]
name = "Cine Flat"
slopes = [1.1, 0.9, 1.1]
power = 1.34
lift = 0.02
sat = 0.92

[[profile]]
name = "Linear"

[[profile]]
name = "Linear Gamma"
gamma = 0.85

[[profile]]
name = "Linear Deep"
power = 2.0

[[profile]]
name = "Linear Flat"
power = 1.4

# ------------------------------------------------------------------------------------------------
# Film stocks: gentle corrections of reported tendencies (sources in the README)


# the generic masked-film correction (the former "Basic" colour model)
[[stock]]
name = "Generic"

# no correction at all (the former "None")
[[stock]]
name = "None (as scanned)"
crosstalk = 0.0

# Kodak Portra 160: flat, pastel, slightly desaturated by design; slight magenta-blue bias
[[stock]]
name = "Kodak Portra 160"
sat = 1.05
contrast = 1.4
tint = -2.0
highlights = [-0.003, 0.0, 0.003]
hue_sat = [1.0, 1.03, 1.02, 1.0, 1.0, 1.0]

# Kodak Portra 400: natural, low saturation; slight magenta-blue bias
[[stock]]
name = "Kodak Portra 400"
tint = -2.0

# Kodak Portra 800: warmer, more saturated and contrasty than its siblings
[[stock]]
name = "Kodak Portra 800"
sat = 0.97
contrast = -1.4
temp = -2.0
highlights = [-0.004, 0.0, 0.004]

# Kodak Ektar 100: the most saturated C-41 stock, warm orange lean, reddish skin
[[stock]]
name = "Kodak Ektar 100"
crosstalk = 1.1
sat = 0.93
contrast = -1.0
temp = -3.0
hue_sat = [0.88, 0.94, 1.0, 1.0, 1.0, 0.96]

# Kodak Gold 200: warm, reds and yellows pushed, contrasty; weak on overcast days
[[stock]]
name = "Kodak Gold 200"
contrast = -1.4
temp = -4.0
hue_sat = [0.92, 0.9, 1.02, 1.0, 1.0, 1.0]

# Kodak UltraMax 400: saturated and a bit punchier than Portra, slightly cooler than Gold
[[stock]]
name = "Kodak UltraMax 400"
sat = 0.95
contrast = -1.0
temp = -1.0

# Kodak ColorPlus 200: soft colour, moderate contrast, flat in dull light
[[stock]]
name = "Kodak ColorPlus 200"
sat = 1.06
contrast = 1.4

# Kodak Vision3 50D (ECN-2 cine stock): flat by design, meant to be graded
[[stock]]
name = "Kodak Vision3 50D"
sat = 1.04
contrast = 2.8

# Kodak Vision3 250D: flat by design
[[stock]]
name = "Kodak Vision3 250D"
sat = 1.06
contrast = 3.5

# Kodak Vision3 500T: flat, tungsten-balanced (Auto-Neutral removes the daylight blue)
[[stock]]
name = "Kodak Vision3 500T"
sat = 1.05
contrast = 3.5

# CineStill 50D (Vision3 50D without remjet): fine grain, accurate; red halation
[[stock]]
name = "CineStill 50D"
sat = 1.03
contrast = 2.1

# CineStill 400D: medium contrast, occasional mint-green cast
[[stock]]
name = "CineStill 400D"
sat = 1.04
contrast = 2.1
tint = 4.0
shadows = [0.0, -0.004, 0.0]

# CineStill 800T (Vision3 500T without remjet): flat-ish, tungsten-balanced; red halation
[[stock]]
name = "CineStill 800T"
sat = 1.04
contrast = 2.8

# Fujifilm Superia X-TRA 400: magenta casts reported in scans
[[stock]]
name = "Fujifilm Superia X-TRA 400"
tint = -5.0
hue_sat = [1.0, 1.0, 1.04, 1.0, 1.0, 0.9]

# Fujicolor C200 (the classic Fuji emulsion): cool, green-leaning
[[stock]]
name = "Fujicolor C200"
sat = 1.02
temp = 2.0
tint = 2.0
hue_sat = [1.0, 1.0, 0.97, 1.0, 1.0, 1.0]

# Fujifilm 200 (2022 on): its datasheet matches Kodak Gold 200's, so corrected like Gold
[[stock]]
name = "Fujifilm 200"
contrast = -1.0
temp = -3.0
hue_sat = [0.93, 0.92, 1.02, 1.0, 1.0, 1.0]

# Fujifilm 400 (US, 2023 on): widely thought to be UltraMax-like; corrected like UltraMax
[[stock]]
name = "Fujifilm 400"
sat = 0.96
contrast = -1.0
temp = -1.0

# Fujifilm Pro 400H (discontinued, fourth colour layer): pastel, greenish-blue cast
[[stock]]
name = "Fujifilm Pro 400H"
sat = 1.03
temp = 2.0
tint = 3.0
hue_sat = [1.0, 1.0, 0.96, 0.97, 1.0, 1.0]

# Harman Phoenix 200 (I): no orange mask, high contrast, shadows fall off fast; bold reds and
# blues, weak yellows and skin; warm highlights over cold, greenish shadows
[[stock]]
name = "Harman Phoenix 200"
crosstalk = 1.4
temp = -3.0
shadows = [0.003, -0.004, 0.001]
highlights = [-0.003, 0.0, 0.003]
hue_sat = [0.92, 1.08, 1.0, 0.97, 0.94, 1.0]

# Harman Phoenix II: no orange mask; more normal contrast and colour than Phoenix I, cooler
# blues and greens, shadows still fall off fast
[[stock]]
name = "Harman Phoenix II"
crosstalk = 1.3
temp = 2.0
tint = 1.0
shadows = [0.002, -0.003, 0.0]
hue_sat = [0.97, 1.03, 0.98, 0.97, 0.97, 1.0]

# Lomography Color Negative 400 (thought to be Kodak-made): balanced, slightly muted
[[stock]]
name = "Lomography 400"
sat = 1.06

# Lomography Color Negative 800: medium-high saturation, natural skin
[[stock]]
name = "Lomography 800"
sat = 0.98
contrast = -0.7

