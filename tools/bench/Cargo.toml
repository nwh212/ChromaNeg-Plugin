[package]
name = "bench"
description = "Scores ChromaNeg against reference conversions of the same scans (a native dev tool)"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
chromaneg-core = { path = "../../crates/chromaneg-core" }
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
serde_json = "1"
toml = "0.8"
